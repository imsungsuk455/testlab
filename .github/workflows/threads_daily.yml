name: Threads Daily Marketing

on:
  schedule:
    # KST→UTC = -9h. ensure_cron.py가 보장 (고정 슬롯 06/09/12/15/18/21 + 기존 캠페인 시간)
    - cron: '0 21 * * *'   # KST 06:00
    - cron: '0 0 * * *'   # KST 09:00
    - cron: '0 3 * * *'   # KST 12:00
    - cron: '0 4 * * *'   # KST 13:00
    - cron: '0 6 * * *'   # KST 15:00
    - cron: '0 9 * * *'   # KST 18:00
    - cron: '0 12 * * *'   # KST 21:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv

      - name: Prepare env
        run: |
          echo "THREADS_ACCESS_TOKEN=${{ secrets.THREADS_ACCESS_TOKEN }}" >> .env
          echo "THREADS_USER_ID=${{ secrets.THREADS_USER_ID }}" >> .env

      - name: Set PUBLISH_HOUR (KST) from cron trigger
        run: |
          # cron 스케줄에 따라 KST 발행 시간대 설정
          # 스크립트가 ±1시간 매칭 + 4시간 경과 캐치업 + 어제 미발행 캐치업으로 처리하므로
          # cron 지연 시에도 누락 없이 발행됨. 날짜 기준은 KST (스크립트 내부 계산)
          if [ "${{ github.event.schedule }}" = "0 21 * * *" ]; then
            echo "PUBLISH_HOUR=6" >> $GITHUB_ENV
          elif [ "${{ github.event.schedule }}" = "0 0 * * *" ]; then
            echo "PUBLISH_HOUR=9" >> $GITHUB_ENV
          elif [ "${{ github.event.schedule }}" = "0 3 * * *" ]; then
            echo "PUBLISH_HOUR=12" >> $GITHUB_ENV
          elif [ "${{ github.event.schedule }}" = "0 4 * * *" ]; then
            echo "PUBLISH_HOUR=13" >> $GITHUB_ENV
          elif [ "${{ github.event.schedule }}" = "0 6 * * *" ]; then
            echo "PUBLISH_HOUR=15" >> $GITHUB_ENV
          elif [ "${{ github.event.schedule }}" = "0 9 * * *" ]; then
            echo "PUBLISH_HOUR=18" >> $GITHUB_ENV
          elif [ "${{ github.event.schedule }}" = "0 12 * * *" ]; then
            echo "PUBLISH_HOUR=21" >> $GITHUB_ENV
          else
            echo "PUBLISH_HOUR=" >> $GITHUB_ENV
          fi

      - name: Publish today's marketing post
        run: |
          # 각 스케줄 파일을 개별적으로 처리 (와일드카드 확장 문제 방지)
          for f in output/marketing_posts_*.json; do
            echo "Processing: $f"
            python scripts/threads_publish.py "$f" || echo "NO_SLOT_OR_SKIPPED: $f"
          done

      - name: Commit schedule updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output/marketing_posts_*.json
          git commit -m "Threads marketing: update schedule status" || echo "No changes"
          git push
