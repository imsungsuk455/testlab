name: Threads Daily Marketing

on:
  schedule:
    # ⚠️ 발행 시간은 사용자가 설정한 KST 시간에 맞춰 수정한다 (KST→UTC = -9h)
    # 캠페인별 발행 시각이 다를 수 있으므로 cron을 여러 개 등록하고,
    # 스크립트가 slot의 publish_time(KST 시각)과 현재 시각이 일치할 때만 발행한다.
    # 예: KST 18:00 → UTC 09:00 → '0 9 * * *'  (기존 social-position 캠페인)
    #     KST 21:00 → UTC 12:00 → '0 12 * * *' (wealth-face-2026 캠페인)
    - cron: '0 9 * * *'   # KST 18:00 (저녁 6시)
    - cron: '0 12 * * *'  # KST 21:00 (저녁 9시)
    - cron: '0 4 * * *'   # KST 13:00 (낮 1시, flirt-quiz-2026 캠페인)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv

      - name: Prepare env
        run: |
          echo "THREADS_ACCESS_TOKEN=${{ secrets.THREADS_ACCESS_TOKEN }}" >> .env
          echo "THREADS_USER_ID=${{ secrets.THREADS_USER_ID }}" >> .env

      - name: Publish today's marketing post
        run: |
          # 각 스케줄 파일을 개별적으로 처리 (와일드카드 확장 문제 방지)
          for f in output/marketing_posts_*.json; do
            echo "Processing: $f"
            python scripts/threads_publish.py "$f" || echo "NO_SLOT_OR_SKIPPED: $f"
          done

      - name: Commit schedule updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output/marketing_posts_*.json
          git commit -m "Threads marketing: update schedule status" || echo "No changes"
          git push
